[project]
name = "radinfra-history"
version = "0.1.0"
description = "OSM history of cycling infrastructure, classified like radinfra.de, as one time-aware PMTiles archive"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "manby>=0.2.8",
    "numpy>=2.5.5",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
