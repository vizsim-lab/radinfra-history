# Publishes site/ on GitHub Pages, together with the tiles and the timeline.
#
# The built data is not committed to main: it lives on the `data` branch as a
# single commit that scripts/publish_data.sh replaces, so the repository does not
# grow by a tileset on every rebuild. This workflow puts the files next to the
# page before uploading it, which keeps tiles and page on one origin — no CORS,
# and Pages answers the Range requests PMTiles makes.
#
# A push to `data` cannot start this workflow (that branch has no workflow
# files), so publish_data.sh starts it explicitly.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch tiles and timeline from the data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: _data

      - name: Put them next to the page
        run: |
          mkdir -p site/tiles site/data
          cp _data/*.pmtiles site/tiles/
          cp _data/*_timeline.json site/data/
          cp _data/*_areas.json _data/*_areas.geojson site/data/ 2>/dev/null || echo "no area data yet"
          ls -l site/tiles site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
