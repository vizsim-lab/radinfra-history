name: Tests

on:
  push:
    paths: ["pipeline/**", "tests/**", "site/radinfra_details_style.json", "pyproject.toml", "uv.lock"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
