# Adds the newest state of OSM to the map, once a quarter.
#
# Geofabrik's public Berlin extract (no login, no personal metadata) is classified
# like every snapshot before it and appended to the versions of the build in the
# bucket (pipeline/versions.py, append_snapshot); areas, tiles and popup file are
# rebuilt from them and published as a new build (scripts/publish_b2.sh). The
# history file is not needed again: the versions are the state.
#
# Started by hand, it builds without publishing unless `publish` is ticked; the
# result is kept as an artifact either way.
#
# It is scheduled every month, because GitHub turns off the schedules of a public
# repository after 60 days without activity, less than a quarter. In the months
# between, it only renews the schedule.
name: Update

on:
  schedule:
    # The 2nd of the month, when Geofabrik's extract of the 1st is out.
    - cron: "41 4 2 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the new snapshot (otherwise build only, kept as an artifact)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # keep the schedule alive

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - name: Start of a quarter?
        id: due
        run: |
          month=$(date -u +%-m)
          if [ "${{ github.event_name }}" != schedule ] || [[ " 1 4 7 10 " == *" $month "* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "month $month: no snapshot due"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXTRACT_URL: https://download.geofabrik.de/europe/germany/berlin/berlin-latest.osm.pbf
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          uv sync --locked
          scripts/fetch_osmnexus.sh

      - name: Current build from the bucket
        run: scripts/fetch_data.sh berlin

      - name: Newest extract
        run: |
          mkdir -p data/extracts
          curl -fsSL --retry 3 -o data/extracts/berlin-latest.osm.pbf "$EXTRACT_URL"
          curl -fsSL --retry 3 "$EXTRACT_URL.md5" \
            | sed 's#  .*#  data/extracts/berlin-latest.osm.pbf#' | md5sum -c -
          osmium fileinfo data/extracts/berlin-latest.osm.pbf

      - name: Append it
        id: update
        run: uv run python -m pipeline update --pbf data/extracts/berlin-latest.osm.pbf --threads 4

      - name: Keep the result
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ steps.update.outputs.date }}
          path: |
            site/data/berlin/timeline.json
            site/data/berlin/builds/${{ steps.update.outputs.build }}/
          retention-days: 30

      - name: Publish
        if: steps.update.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          uv tool install b2==4.7.0
          export PATH="$(uv tool dir --bin):$PATH"
          scripts/publish_b2.sh berlin
